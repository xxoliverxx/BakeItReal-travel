<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100d2b">
  <title>画饼成真 · 梦想进度助手</title>
  <style>
    :root{font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#f8f5ff;background:#0d0b20;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 9%,#59338c66,transparent 33%),radial-gradient(circle at 86% 17%,#3357a855,transparent 34%),radial-gradient(circle at 65% 89%,#922f8370,transparent 40%),#0d0b20;overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.27;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:43px 43px;mask-image:linear-gradient(to bottom,#000,transparent 75%)}
    button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #e2b7ff;outline-offset:3px}
    .shell{max-width:1440px;margin:auto;padding:28px 42px 40px;position:relative}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:42px}.brand{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:800;letter-spacing:.04em}.brand-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#d18eff,#895dff 55%,#5dd5f2);box-shadow:0 0 30px #a56df38c;font-size:22px}.topright{display:flex;align-items:center;gap:20px;color:#bab4d3;font-size:13px}.status{display:flex;align-items:center;gap:7px}.status:before{content:"";width:7px;height:7px;border-radius:50%;background:#74ead0;box-shadow:0 0 12px #74ead0}.avatar{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,#e7baff,#7773e8);color:#292348;font-weight:800}
    .intro{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}.eyebrow{color:#c5a4ff;font-size:12px;font-weight:750;letter-spacing:.24em;margin:0 0 10px}.intro h1{font-size:clamp(32px,3.5vw,52px);letter-spacing:-.05em;line-height:1.15;margin:0 0 10px}.intro h1 span{background:linear-gradient(90deg,#f2b9ff,#b09cff 48%,#87e4f1);background-clip:text;-webkit-text-fill-color:transparent}.subtitle{font-size:14px;color:#bcb6d1;margin:0;line-height:1.7}.intro-tag{border:1px solid #ffffff2c;background:#ffffff0e;padding:10px 14px;border-radius:999px;color:#d9d1ee;font-size:12px;white-space:nowrap}
    .layout{display:grid;grid-template-columns:minmax(420px,1.08fr) minmax(430px,.92fr);gap:22px;align-items:stretch}.panel{background:linear-gradient(145deg,#ffffff14,#ffffff08 55%,#ffffff0c);border:1px solid #ffffff25;box-shadow:0 20px 70px #07041c80,inset 0 1px #ffffff19;border-radius:26px;backdrop-filter:blur(24px)}
    .chat{min-height:640px;display:flex;flex-direction:column;overflow:hidden}.panel-head{padding:22px 25px 18px;border-bottom:1px solid #ffffff19;display:flex;justify-content:space-between;align-items:center}.head-left{display:flex;align-items:center;gap:11px}.bot-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(145deg,#d285e8,#8c72e8);font-size:20px;box-shadow:0 5px 20px #ae70ef55}.panel-head strong{font-size:15px}.panel-head small{display:block;color:#aaa5c5;font-size:11px;margin-top:3px}.head-pill{color:#e8cfff;font-size:11px;padding:7px 10px;border:1px solid #d99cff4d;border-radius:999px;background:#ba74ef19}
    .messages{padding:28px 26px 16px;flex:1;overflow:auto;display:flex;flex-direction:column;gap:17px;min-height:400px;max-height:455px}.msg{display:flex;gap:10px;max-width:90%;align-items:flex-end}.msg.user{align-self:flex-end;flex-direction:row-reverse}.bubble{line-height:1.65;font-size:13px;border-radius:17px;padding:13px 16px;white-space:pre-line}.assistant .bubble{background:#ffffff12;border:1px solid #ffffff1c;border-bottom-left-radius:5px;color:#ece7fb}.user .bubble{background:linear-gradient(135deg,#b487ef,#817bf1);border-bottom-right-radius:5px;color:#fff;box-shadow:0 8px 22px #7851c145}.mini-icon{flex:none;display:grid;place-items:center;width:25px;height:25px;border-radius:9px;background:#b78af5;color:#2d204d;font-size:13px}.message-hint{margin:5px 0 0 36px;color:#a9a1c2;font-size:11px}.suggestions{padding:0 25px 16px;display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #d1b8fb55;background:#b48bef15;color:#dfcef7;border-radius:999px;padding:8px 12px;font-size:11px}.chip:hover{background:#b48bef35}.composer{margin:0 25px 24px;background:#ffffff12;border:1px solid #ffffff31;border-radius:16px;padding:7px 7px 7px 16px;display:flex;align-items:center;gap:8px}.composer input{border:0;outline:0;background:none;color:#fff;min-width:0;flex:1;font-size:13px}.composer input::placeholder{color:#9d97b9}.send{border:0;color:#fff;background:linear-gradient(135deg,#c77df1,#8177f2);height:39px;width:39px;border-radius:11px;font-size:21px;box-shadow:0 5px 15px #9d64dc50}
    .right{display:grid;grid-template-rows:auto 1fr;gap:20px}.dream{padding:22px 26px 24px}.section-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.kicker{font-size:11px;font-weight:750;color:#bbadce;letter-spacing:.14em}.sparkle{color:#efd0ff;font-size:21px}.dream-title{font-size:25px;line-height:1.3;letter-spacing:-.03em;margin:14px 0 8px}.dream-desc{font-size:12px;color:#b8b1d0;line-height:1.65;margin:0}.pie-area{display:flex;align-items:center;justify-content:center;position:relative;padding:7px 0 0;min-height:300px}.pie-glow{position:absolute;width:240px;height:240px;border-radius:50%;background:#a775e4;filter:blur(62px);opacity:.2}.pie-wrap{position:relative;width:276px;height:276px;filter:drop-shadow(0 14px 30px #050318b0)}.pie-wrap svg{width:100%;height:100%;overflow:visible}.pie-wrap .slice{cursor:pointer;transition:opacity .35s,filter .35s;transform-origin:150px 150px}.pie-wrap .slice:hover{filter:brightness(1.16);transform:scale(1.035)}.pie-wrap .slice.just-done{animation:pie-pop .5s cubic-bezier(.2,1.5,.4,1)}.pie-center{position:absolute;right:-8px;top:-7px;width:76px;height:76px;border-radius:50%;background:linear-gradient(145deg,#ecb3f5,#8d78e9);display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid #f8d9ff;box-shadow:0 8px 22px #342059b0;pointer-events:none}.pie-center b{font-size:20px;letter-spacing:-.04em}.pie-center span{font-size:9px;color:#fff;margin-top:2px}@keyframes pie-pop{0%{transform:scale(.86)}60%{transform:scale(1.08)}100%{transform:scale(1)}}.progress-caption{text-align:center;margin:0;color:#c8bfe0;font-size:12px}.progress-caption strong{color:#f3d5ff}.legend{display:flex;justify-content:center;gap:20px;margin-top:18px;font-size:11px;color:#bfb6d5}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#d4a5ff}.dot.dim{background:#72658f}
    .steps{padding:22px 24px 18px}.step-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.step-header h2{font-size:15px;margin:0}.step-header span{font-size:11px;color:#aea5cb}.step{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:10px 8px;background:transparent;color:#efebfa;border:0;border-radius:12px}.step:hover{background:#ffffff10}.check{width:29px;height:29px;flex:none;border:1px solid #baabda6b;border-radius:10px;display:grid;place-items:center;color:transparent;background:#ffffff0c;font-size:16px}.step.done .check{background:linear-gradient(135deg,#d598ee,#8d82f3);color:#fff;border:0;box-shadow:0 0 17px #ae7aea66}.step-copy{flex:1;min-width:0}.step-copy b{display:block;font-size:12px;font-weight:600}.step-copy small{display:block;margin-top:4px;font-size:10px;color:#a8a0bf}.step.done .step-copy b{text-decoration:line-through;text-decoration-color:#bfb1d8;color:#bdb4d0}.step-num{font-size:11px;color:#978cba}.footer-note{margin:14px 0 0;padding:13px 14px;border-radius:12px;background:linear-gradient(90deg,#bf86e321,#6f8fec18);color:#cfc4e8;font-size:11px;line-height:1.5}
    .reset{border:0;background:none;color:#b9a8df;font-size:11px;text-decoration:underline;text-underline-offset:3px}.reset:hover{color:#fff}
    @media(max-width:950px){.shell{padding:23px 22px}.topbar{margin-bottom:30px}.layout{grid-template-columns:1fr}.right{grid-template-columns:1fr 1fr;grid-template-rows:1fr;align-items:stretch}.chat{min-height:600px}.dream,.steps{min-width:0}.pie-area{min-height:270px}.pie-wrap{width:245px;height:245px}}
    @media(max-width:650px){.shell{padding:20px 14px 35px}.topbar{margin-bottom:30px}.topright .status{display:none}.intro{display:block}.intro-tag{display:inline-block;margin-top:16px}.layout,.right{display:flex;flex-direction:column;gap:16px}.chat{min-height:540px}.messages{max-height:390px;min-height:330px}.panel{border-radius:22px}.dream-title{font-size:22px}.pie-area{min-height:270px}.steps{padding-bottom:22px}}
    @media(prefers-reduced-motion:no-preference){.brand-mark{animation:float 4s ease-in-out infinite}.pie-glow{animation:breathe 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-3px)}}@keyframes breathe{50%{opacity:.34;transform:scale(1.08)}}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><div class="brand"><div class="brand-mark">✦</div><span>画饼成真</span></div><div class="topright"><span class="status">你的梦想正在发光</span><div class="avatar">梦</div></div></header>
    <section class="intro"><div><p class="eyebrow">DREAM IT · DO IT</p><h1>把想象，变成<span>下一步。</span></h1><p class="subtitle">大胆画饼，认真吃饼。和小饼聊聊你的梦想，把它切成真正能完成的行动。</p></div><span class="intro-tag">✦ 每个梦想，都从第一口开始</span></section>
    <main class="layout">
      <section class="panel chat" aria-label="梦想聊天助手"><div class="panel-head"><div class="head-left"><span class="bot-icon">✦</span><div><strong>小饼 · 梦想搭子</strong><small>陪你从灵感走到行动</small></div></div><span class="head-pill">● 正在陪伴</span></div><div class="messages" id="messages" aria-live="polite"></div><div class="suggestions"><button class="chip" data-text="我想开一家海边咖啡馆">☕ 开一家海边咖啡馆</button><button class="chip" data-text="我想做自己的播客">🎙 做自己的播客</button><button class="chip" data-text="我想去远方旅行">✈ 去远方旅行</button></div><form class="composer" id="form"><input id="input" aria-label="输入你的梦想或回答" placeholder="说说你的梦想，或者回答小饼…" autocomplete="off"><button class="send" type="submit" aria-label="发送">↑</button></form></section>
      <div class="right"><section class="panel dream" aria-label="梦想进度饼"><div class="section-top"><span class="kicker">✦ 我的梦想进度饼</span><span class="sparkle">✧</span></div><h2 class="dream-title" id="dreamTitle">在海边开一家小咖啡馆</h2><p class="dream-desc" id="dreamDesc">让海风、咖啡香和喜欢的生活方式，慢慢成为日常。</p><div class="pie-area"><div class="pie-glow"></div><div class="pie-wrap"><svg viewBox="0 0 300 300" role="img" aria-label="四块梦想进度饼" id="pie"></svg><div class="pie-center"><b id="fraction">1 / 4</b><span>已吃下的饼</span></div></div></div><p class="progress-caption" id="caption">已经迈出 <strong>第一步</strong>，梦想正在发生 ✨</p><div class="legend"><span><i class="dot"></i>已经做到</span><span><i class="dot dim"></i>等待点亮</span></div></section><section class="panel steps"><div class="step-header"><h2>切成四块，慢慢吃掉</h2><button class="reset" id="reset">重新画一张饼</button></div><div id="steps"></div><p class="footer-note" id="note">💡 下一口：去两家喜欢的咖啡馆观察客流与价格，把想象变成真实线索。</p></section></div>
    </main>
  </div>
  <script>
    const presets={coffee:{title:'在海边开一家小咖啡馆',desc:'让海风、咖啡香和喜欢的生活方式，慢慢成为日常。',steps:[['说清楚理想中的咖啡馆','写下地点、氛围与想服务的人'],['实地观察两家目标店','记录客流、价格和自己的感受'],['算一版最小启动预算','列出房租、设备与每月固定成本'],['做一次周末快闪实验','用真实反馈决定下一步']],note:'去两家喜欢的咖啡馆观察客流与价格，把想象变成真实线索。'},podcast:{title:'做一档自己的播客',desc:'把脑海里的好奇心，变成值得分享的声音。',steps:[['写下播客主题与听众','用一句话说明想聊给谁听'],['列出前三期选题','每期只回答一个具体问题'],['录制三分钟样片','用手机录音即可，不追求完美'],['邀请一位朋友试听','记录一个最想改进的地方']],note:'先写一句“这档播客是讲给谁听的”，再列出前三期选题。'},travel:{title:'去一次期待已久的远方旅行',desc:'让地图上的那个点，变成真实走过的路。',steps:[['选定目的地和出行窗口','明确想在那里获得什么体验'],['估算旅费与请假天数','确认时间和预算的真实边界'],['做一份三日行程草图','每天只安排一件最期待的事'],['预订第一项行程','把计划变成确定的承诺']],note:'确定一个目的地和可出行的月份，梦想就有了坐标。'}};
    let state={stage:0,kind:'coffee',done:[true,false,false,false],customDream:''};
    const $=id=>document.getElementById(id);const messages=$('messages');
    function addMessage(content,who='assistant'){const row=document.createElement('div');row.className='msg '+who;if(who==='assistant'){const icon=document.createElement('span');icon.className='mini-icon';icon.textContent='✦';row.append(icon)}const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=content;row.append(bubble);messages.append(row);messages.scrollTop=messages.scrollHeight}
    function chooseKind(text){if(/播客|录音|声音/.test(text))return'podcast';if(/旅行|旅游|远方|出游/.test(text))return'travel';return'coffee'}
    function sector(cx,cy,r1,r2,a,b){const p=(r,deg)=>[cx+r*Math.cos(deg*Math.PI/180),cy+r*Math.sin(deg*Math.PI/180)];let A=p(r2,a),B=p(r2,b),C=p(r1,b),D=p(r1,a);if(r1===0)return `M ${cx} ${cy} L ${A.join(' ')} A ${r2} ${r2} 0 0 1 ${B.join(' ')} Z`;return `M ${A.join(' ')} A ${r2} ${r2} 0 0 1 ${B.join(' ')} L ${C.join(' ')} A ${r1} ${r1} 0 0 0 ${D.join(' ')} Z`}
    const ns='http://www.w3.org/2000/svg';function svg(tag,attrs){const el=document.createElementNS(ns,tag);for(const [key,value] of Object.entries(attrs))el.setAttribute(key,value);return el}
    function berry(group,x,y,r,color){group.append(svg('circle',{cx:x+2,cy:y+3,r:r+2,fill:'#4e2350',opacity:'.35'}),svg('circle',{cx:x,cy:y,r,fill:color}),svg('ellipse',{cx:x-r*.32,cy:y-r*.4,rx:r*.28,ry:r*.16,fill:'#fff',opacity:'.65',transform:`rotate(-30 ${x} ${y})`}))}
    let lastToggled=-1;function renderPie(){const pie=$('pie');pie.replaceChildren();const defs=svg('defs',{});[['filling','#ffacd1','#a94d92'],['crust','#ffe29a','#d78a4f'],['cream','#fffaf4','#d7c7f6']].forEach(([id,a,b])=>{const grad=svg('radialGradient',{id,cx:'35%',cy:'26%',r:'75%'});grad.append(svg('stop',{offset:'0%','stop-color':a}),svg('stop',{offset:'100%','stop-color':b}));defs.append(grad)});pie.append(defs);
      state.done.forEach((done,i)=>{const a=-90+i*90+2,b=-90+(i+1)*90-2,mid=(a+b)/2,rad=mid*Math.PI/180,x=150+69*Math.cos(rad),y=150+69*Math.sin(rad);const group=svg('g',{class:'slice'+(i===lastToggled&&done?' just-done':''),opacity:done?'1':'.43',role:'button',tabindex:'0','aria-label':(done?'取消完成':'标记完成')+'第'+(i+1)+'块饼'});
        group.append(svg('path',{d:sector(150,156,0,138,a,b),fill:'#603956',opacity:'.55'}));group.append(svg('path',{d:sector(150,149,0,130,a,b),fill:'url(#crust)',stroke:'#b86645','stroke-width':'2'}));group.append(svg('path',{d:sector(150,149,0,112,a,b),fill:'url(#filling)',stroke:'#ffe9b2','stroke-width':'2'}));group.append(svg('path',{d:sector(150,149,113,130,a,b),fill:'url(#crust)',stroke:'#fff0b8','stroke-width':'3'}));
        berry(group,x-17,y+11,12,i%2?'#7751ae':'#d84378');berry(group,x+17,y+13,10,i%2?'#d84378':'#7253a8');group.append(svg('circle',{cx:x,cy:y-15,r:17,fill:'url(#cream)',stroke:'#fff','stroke-width':'2'}));group.append(svg('path',{d:`M ${x-9} ${y-15} Q ${x-1} ${y-28} ${x+8} ${y-16} Q ${x+14} ${y-7} ${x} ${y-8}`,fill:'none',stroke:'#e9dafb','stroke-width':'3','stroke-linecap':'round'}));group.append(svg('circle',{cx:x+2,cy:y-17,r:3,fill:'#e68cab'}));
        group.addEventListener('click',()=>toggle(i));group.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle(i)}});pie.append(group)});lastToggled=-1}
    
    function render(){const data=presets[state.kind];$('dreamTitle').textContent=state.customDream||data.title;$('dreamDesc').textContent=data.desc;const count=state.done.filter(Boolean).length;$('fraction').textContent=`${count} / 4`;$('caption').innerHTML=count===0?'还没开始，先吃下 <strong>第一口</strong> 吧 ✨':count===4?'太棒了，<strong>四块饼都吃下了</strong> ✨':`已经完成 <strong>${count} 块</strong>，梦想正在发生 ✨`;
      renderPie();
      const steps=$('steps');steps.replaceChildren();data.steps.forEach(([title,sub],i)=>{const b=document.createElement('button');b.type='button';b.className='step'+(state.done[i]?' done':'');b.innerHTML=`<span class="check" aria-hidden="true">✓</span><span class="step-copy"><b></b><small></small></span><span class="step-num">0${i+1}</span>`;b.querySelector('b').textContent=title;b.querySelector('small').textContent=sub;b.setAttribute('aria-label',(state.done[i]?'取消完成：':'标记完成：')+title);b.querySelector('b').textContent=title;b.addEventListener('click',()=>toggle(i));steps.append(b)});const next=state.done.findIndex(x=>!x);$('note').textContent=next<0?'🎉 这张饼已经吃完！你可以重新画一张更大的饼。':'💡 下一口：'+(next===1?data.note:data.steps[next][1]+'。')}
    function toggle(i){state.done[i]=!state.done[i];lastToggled=i;render()}
    function send(value){const v=value.trim();if(!v)return;addMessage(v,'user');$('input').value='';if(state.stage===0){state.kind=chooseKind(v);state.customDream=state.kind==='coffee'&&!/咖啡|海边/.test(v)?v:'';state.done=[false,false,false,false];state.stage=1;render();setTimeout(()=>addMessage('这张饼很美！如果要让它开始发生，你现在每周能拿出多少时间？最大的阻碍是什么？'),420)}else if(state.stage===1){state.stage=2;setTimeout(()=>{addMessage('收到。我先把梦想切成四块，第一块足够小，这周就能开始。点亮右侧的一块饼，看看进度如何变化 ✨');render()},420)}else{setTimeout(()=>addMessage('这很有价值。先完成右侧最小的一块；每完成一步，梦想进度饼就会被真正点亮。'),350)}}
    $('form').addEventListener('submit',e=>{e.preventDefault();send($('input').value)});document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>send(b.dataset.text)));$('reset').addEventListener('click',()=>{state={stage:0,kind:'coffee',done:[false,false,false,false],customDream:''};messages.replaceChildren();addMessage('嗨，我是小饼 ✦\n你负责大胆想象，我陪你把梦想切成能完成的第一步。你想画一张什么饼？');render()});
    addMessage('如果有一天，你能过上最想要的生活，它会是什么样子？');addMessage('我想在海边开一家小咖啡馆。','user');addMessage('好喜欢这张饼！我们先切成四块。每完成一个真实行动，就点亮一块。现在你已经说清了梦想，下一口是去实地观察两家店。');render();
  </script>
</body>
</html>
